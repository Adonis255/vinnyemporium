{% extends "base.html" %}

{% block content %}
<div class="dashboard">
    <div class="dashboard-header">
        <h1>Admin Dashboard</h1>
        <a href="/admin/logout" class="btn-logout">Logout</a>
    </div>

    <!-- Categories Management -->
    <div class="dashboard-section">
        <h2>Manage Categories</h2>
        <div class="category-manager">
            <div class="category-input">
                <input type="text" id="new-category-name" placeholder="New category name" />
                <button id="add-category-btn" class="btn-primary">Add Category</button>
            </div>
            <ul id="category-list" class="category-list">
                <li style="text-align:center; color:#888; padding:1rem 0;">No categories yet. Add one above!</li>
            </ul>
        </div>
    </div>

    <!-- Products Management -->
    <div class="dashboard-section">
        <h2>Manage Products</h2>
        <div class="dashboard-actions">
            <button id="add-product-btn" class="btn-primary">+ Add New Product</button>
        </div>

        <!-- Admin Search Bar -->
        <div class="admin-search-container" style="margin-bottom: 1.5rem; max-width: 400px;">
            <input type="text" id="admin-product-search" placeholder="🔍 Search products by name or ID..." class="search-input" />
        </div>

        <div id="product-table-container">
            <table id="product-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Category</th>
                        <th>Price (KSh)</th>
                        <th>Status</th>
                        <th>Images</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="product-table-body">
                    <!-- Rows injected via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add/Edit Product Modal -->
    <div id="product-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2 id="modal-title">Add Product</h2>
            <form id="product-form" enctype="multipart/form-data">
                <input type="hidden" id="product-id" />
                <div class="form-group">
                    <label>Product Name</label>
                    <input type="text" id="product-name" required />
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="product-category" required>
                        <!-- Populated dynamically -->
                    </select>
                </div>
                <div class="form-group">
                    <label>Price (KSh)</label>
                    <input type="number" step="0.01" id="product-price" required />
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="product-description" rows="2"></textarea>
                </div>
                
                <div class="form-group" style="border-top: 1px solid #eee; padding-top: 1rem; margin-top: 1rem;">
                    <label><strong>Front Image</strong> (Upload file <em>or</em> paste URL)</label>
                    <input type="file" id="product-image-front-file" accept="image/*" />
                    <input type="url" id="product-image-front-url" placeholder="https://..." style="margin-top:0.5rem;" />
                </div>

                <div class="form-group" style="border-top: 1px solid #eee; padding-top: 1rem; margin-top: 1rem;">
                    <label><strong>Back Image</strong> (Optional)</label>
                    <input type="file" id="product-image-back-file" accept="image/*" />
                    <input type="url" id="product-image-back-url" placeholder="https://..." style="margin-top:0.5rem;" />
                </div>

                <!-- ===== REPLACED DROPDOWN WITH RADIO BUTTONS ===== -->
                <div class="form-group" style="border-top: 1px solid #eee; padding-top: 1rem; margin-top: 1rem;">
                    <label><strong>Select Product Badge</strong></label>
                    <div style="display: flex; flex-wrap: wrap; gap: 1rem; margin-top: 0.5rem;">
                        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; font-size:0.9rem;">
                            <input type="radio" name="product_status" value="" /> None
                        </label>
                        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; font-size:0.9rem;">
                            <input type="radio" name="product_status" value="Discount Offer" /> 🔴 Discount Offer
                        </label>
                        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; font-size:0.9rem;">
                            <input type="radio" name="product_status" value="Few Pieces Selling" /> 🟠 Few Pieces
                        </label>
                        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; font-size:0.9rem;">
                            <input type="radio" name="product_status" value="Top Selling" /> 🟡 Top Selling
                        </label>
                        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; font-size:0.9rem;">
                            <input type="radio" name="product_status" value="Latest Model" /> 🔵 Latest Model
                        </label>
                    </div>
                </div>
                <!-- =========================================== -->

                <button type="submit" class="btn-primary" style="margin-top: 1rem;">Save Product</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
