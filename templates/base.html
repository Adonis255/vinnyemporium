<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vinny Emporium</title>

    <!-- ===== FAVICONS ===== -->
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32x32.png') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='favicon-16x16.png') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    <link rel="manifest" href="{{ url_for('static', filename='site.webmanifest') }}">
    <meta name="theme-color" content="#45d728">

    <!-- ===== GOOGLE SEARCH CONSOLE VERIFICATION ===== -->
    <meta name="google-site-verification" content="9-ttM8WYzlRfGVhQaThFc-27XYrFJqt0zfdYDnY" />

    <!-- ===== GOOGLE ANALYTICS (gtag.js) ===== -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZWTCXY534F"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-ZWTCXY534F');
    </script>
    <!-- ========================================== -->

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="brand"><i class="fas fa-store"></i> Vinny Emporium</a>
            <ul class="nav-links">
                <li><a href="/">Home</a></li>
                <li><a href="/catalogue">Catalogue</a></li>
                
                <!-- ===== Hides Admin link on Home and Catalogue ===== -->
                {% if request.path != '/' and request.path != '/catalogue' %}
                <li><a href="/admin" class="admin-link"><i class="fas fa-crown"></i> Admin</a></li>
                {% endif %}
                <!-- ================================================== -->
                
            </ul>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 Vinny Emporium – Premium Electronics</p>
    </footer>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
