{% extends "base.html" %}

{% block content %}
<section class="catalogue">
    <div class="catalogue-header">
        <h1>Our Catalogue</h1>
        
        <div class="filter-wrapper">
            <!-- Desktop Category Buttons -->
            <div class="category-filters" id="category-filters">
                <!-- Populated by JS -->
            </div>
            
            <!-- Mobile Dropdown -->
            <select id="category-dropdown" class="category-dropdown">
                <!-- Populated by JS -->
            </select>
        </div>

        <!-- Search Bar -->
        <div class="search-container">
            <input type="text" id="search-input" placeholder="🔍 Search for products..." class="search-input" />
        </div>
    </div>

    <div id="products-grid" class="product-grid">
        <!-- Products injected via JS -->
    </div>
</section>

<!-- ===== NEW: FULL SCREEN MODAL (ADDED AT THE BOTTOM) ===== -->
<div id="product-modal-overlay" class="modal-overlay" style="display: none;">
    <div class="modal-box">
        <button class="modal-close-btn">&times;</button>
        <div class="modal-layout">
            <div class="modal-image-container">
                <button class="modal-arrow modal-prev"><i class="fas fa-chevron-left"></i></button>
                <img id="modal-product-image" src="" alt="Product Image" class="modal-img" />
                <button class="modal-arrow modal-next"><i class="fas fa-chevron-right"></i></button>
                <div class="modal-dots"></div>
            </div>
            <div class="modal-details">
                <h2 id="modal-product-title"></h2>
                <span class="modal-category"></span>
                <div class="modal-price"></div>
                <div class="modal-description"></div>
                <a id="modal-whatsapp-btn" href="#" target="_blank" class="whatsapp-btn">
                    <i class="fab fa-whatsapp"></i> Order via WhatsApp
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
